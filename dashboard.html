<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Clartu — Dashboard Financiero</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 24px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:10}
.header h1{font-size:17px;font-weight:700;margin:0}
.header p{font-size:11px;color:#94a3b8;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
.btn-blue{background:#3b82f6;color:#fff}.btn-blue:hover{background:#2563eb}
.btn-outline{background:#fff;color:#374151;border:1px solid #e2e8f0}.btn-outline:hover{background:#f8fafc}
.btn-full{width:100%}
.wrap{max-width:920px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:18px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px}
.setup-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f8fafc}
.setup-box{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:40px;max-width:440px;width:100%;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06)}
input[type=password]{width:100%;border:1px solid #e2e8f0;border-radius:10px;padding:9px 14px;font-size:13px;outline:none;margin-top:6px}
input:focus{border-color:#3b82f6}
label{font-size:12px;font-weight:600;color:#374151;display:block;text-align:left}
label a{color:#3b82f6;font-weight:400}
.spin{width:36px;height:36px;border:3px solid #3b82f6;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kpi{border-radius:14px;padding:16px}
.kpi .icon{font-size:20px;margin-bottom:6px}
.kpi .lbl{font-size:10px;color:#94a3b8;margin-bottom:3px;text-transform:uppercase}
.kpi .val{font-size:21px;font-weight:700}
.kpi .sub{font-size:10px;color:#94a3b8;margin-top:2px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-label{font-size:11px;color:#374151;width:90px;flex-shrink:0}
.bar-track{flex:1;background:#f1f5f9;border-radius:999px;height:10px;overflow:hidden}
.bar-fill{height:10px;border-radius:999px;transition:width .4s}
.bar-val{font-size:11px;font-weight:600;width:80px;text-align:right;flex-shrink:0}
.bar-pct{font-size:10px;color:#94a3b8;width:36px;text-align:right;flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 12px;text-align:left;font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;background:#f8fafc}
td{padding:8px 12px;border-top:1px solid #f1f5f9}
tr:hover td{background:#fafafa}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700}
.health-card{border-radius:16px;padding:18px;display:flex;justify-content:space-between;align-items:center}
select{border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;font-size:13px;outline:none;background:#fff}
.month-bar{display:flex;align-items:flex-end;gap:4px;height:100px;padding-bottom:4px}
.month-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.month-fill{width:100%;border-radius:4px 4px 0 0;min-height:2px}
.month-name{font-size:9px;color:#94a3b8}
</style>
</head>
<body>

<div id="setupScreen" class="setup-screen">
  <div class="setup-box">
    <div style="font-size:44px;margin-bottom:12px">📊</div>
    <h1 style="font-size:22px;font-weight:700;margin-bottom:8px">Dashboard Clartu</h1>
    <p style="color:#64748b;font-size:13px;margin-bottom:24px">Conecta tu Notion para ver tus finanzas consolidadas</p>
    <div style="margin-bottom:14px;text-align:left">
      <label>Token de integración Notion <a href="https://www.notion.so/profile/integrations/internal" target="_blank">(obtener →)</a></label>
      <input type="password" id="tokenInput" placeholder="secret_ o ntn_..." oninput="document.getElementById('connectBtn').disabled=this.value.length<10"/>
    </div>
    <p id="setupErr" style="color:#dc2626;font-size:12px;margin-bottom:10px;display:none"></p>
    <button class="btn btn-blue btn-full" id="connectBtn" onclick="connect()" disabled>Conectar y ver dashboard</button>
    <button class="btn btn-outline btn-full" id="savedBtn" style="margin-top:8px;display:none" onclick="useSaved()">Usar token guardado</button>
    <p style="font-size:11px;color:#94a3b8;margin-top:12px">🔒 Tu token se guarda solo en tu navegador</p>
  </div>
</div>

<div id="dashboard" style="display:none">
  <div class="header">
    <span style="font-size:20px">📊</span>
    <div><h1>Dashboard Clartu</h1><p id="headerSub">Cargando...</p></div>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
      <select id="periodoSel" style="display:none" onchange="renderPeriodo()"></select>
      <button class="btn btn-outline" style="font-size:12px" onclick="logout()">Salir</button>
    </div>
  </div>
  <div class="wrap">
    <div id="loadingDiv" style="text-align:center;padding:60px">
      <div class="spin" style="margin-bottom:16px"></div>
      <p style="color:#64748b">Cargando datos desde Notion...</p>
    </div>
    <div id="content" style="display:none"></div>
  </div>
</div>

<script>
const DB_GASTOS="2b1ddb96335d81daabadf8e1a9d1b349";
const DB_LIQS="9658270ba4b643c5ae3105a938d7a0cb";
const UTM=68306;
const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const fmt=n=>"$"+Math.round(n||0).toLocaleString("es-CL");
const fmtK=n=>n>=1000000?"$"+(n/1000000).toFixed(1)+"M":n>=1000?"$"+(n/1000).toFixed(0)+"K":fmt(n);
const pct=n=>((n||0)*100).toFixed(1)+"%";
const CAT_CLR={Alimentos:"#22c55e",Transporte:"#3b82f6",Salud:"#ef4444",Entretenimiento:"#a855f7",Servicios:"#f59e0b",Salida:"#f97316","Alquiler/hipoteca":"#64748b"};
let token="",gastos=[],liqs=[],periodos=[];

window.onload=()=>{const t=localStorage.getItem("clartu_notion");if(t)document.getElementById("savedBtn").style.display="block";};
function useSaved(){token=localStorage.getItem("clartu_notion")||"";if(token)loadDashboard();}
function connect(){token=document.getElementById("tokenInput").value.trim();if(!token)return;localStorage.setItem("clartu_notion",token);loadDashboard();}
function logout(){document.getElementById("dashboard").style.display="none";document.getElementById("setupScreen").style.display="flex";gastos=[];liqs=[];periodos=[];}

async function notionQ(dbId){
  const r=await fetch(`/api/notion?path=databases/${dbId}/query`,{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({page_size:100})});
  if(!r.ok)throw new Error("Error Notion "+r.status+": "+(await r.text()).slice(0,200));
  return(await r.json()).results||[];
}

function gp(page,name){
  const p=page.properties?.[name];if(!p)return null;
  if(p.type==="number")return p.number;
  if(p.type==="title")return p.title?.[0]?.plain_text||"";
  if(p.type==="rich_text")return p.rich_text?.[0]?.plain_text||"";
  if(p.type==="select")return p.select?.name||"";
  if(p.type==="date")return p.date?.start||"";
  return null;
}

async function loadDashboard(){
  document.getElementById("setupScreen").style.display="none";
  document.getElementById("dashboard").style.display="block";
  document.getElementById("loadingDiv").style.display="block";
  document.getElementById("content").style.display="none";
  try{
    [gastos,liqs]=await Promise.all([notionQ(DB_GASTOS),notionQ(DB_LIQS)]);
    liqs.sort((a,b)=>(gp(b,"Fecha Liquidación")||"").localeCompare(gp(a,"Fecha Liquidación")||""));
    periodos=liqs.map((l,i)=>({
      idx:i,label:gp(l,"Período")||"Sin período",fecha:gp(l,"Fecha Liquidación")||"",
      bruto:gp(l,"Sueldo Bruto")||0,liquido:gp(l,"Sueldo Líquido")||0,
      afp:gp(l,"AFP")||0,salud:gp(l,"Isapre/Fonasa")||0,
      impuesto:gp(l,"Impuesto 2da Cat.")||0,
      apvSug:gp(l,"APV Sugerido Mensual")||0,
      benAPV:gp(l,"Beneficio APV Anual")||0,
      regimen:gp(l,"Régimen APV Recomendado")||"",
    }));
    const sel=document.getElementById("periodoSel");
    sel.innerHTML=periodos.map((p,i)=>`<option value="${i}">${p.label}</option>`).join("");
    sel.style.display=periodos.length>0?"block":"none";
    document.getElementById("headerSub").textContent=gastos.length+" gastos · "+liqs.length+" liquidaciones";
    document.getElementById("loadingDiv").style.display="none";
    document.getElementById("content").style.display="block";
    renderPeriodo();
  }catch(e){
    document.getElementById("loadingDiv").innerHTML=`<div style="color:#dc2626;font-weight:600;margin-bottom:12px">❌ ${e.message}</div><p style="color:#64748b;font-size:13px;margin-bottom:16px">Verifica que el token sea correcto y que la integración Clartu esté conectada.</p><button class="btn btn-outline" onclick="logout()">← Volver</button>`;
  }
}

function renderPeriodo(){
  const idx=parseInt(document.getElementById("periodoSel").value||"0");
  const p=periodos[idx]||null;

  // SIEMPRE mostrar todos los gastos
  const gastosVista=gastos;
  const totalG=gastosVista.reduce((s,g)=>s+(gp(g,"Monto")||0),0);

  // Breakdown por categoría
  const bycat={};
  gastosVista.forEach(g=>{const c=gp(g,"Etiqueta")||"Otro";bycat[c]=(bycat[c]||0)+(gp(g,"Monto")||0);});
  const topCat=Object.entries(bycat).sort((a,b)=>b[1]-a[1]);

  // Gastos por mes (todos los años)
  const byMes=Array(12).fill(0);
  gastosVista.forEach(g=>{
    const f=gp(g,"Fecha")||"";
    const m=parseInt(f.slice(5,7))-1;
    if(m>=0&&m<12)byMes[m]+=(gp(g,"Monto")||0);
  });
  const maxMes=Math.max(...byMes,1);

  const flujo=p?(p.liquido-totalG):0;
  const tasaA=p?.liquido>0?flujo/p.liquido:0;
  const salud=tasaA>=.2?{l:"Excelente 🟢",c:"#166534",bg:"#f0fdf4"}:tasaA>=.1?{l:"Saludable 🔵",c:"#1d4ed8",bg:"#eff6ff"}:tasaA>=0?{l:"Ajustado 🟡",c:"#92400e",bg:"#fefce8"}:{l:"Déficit 🔴",c:"#dc2626",bg:"#fef2f2"};
  const apvO=Math.min(p?.apvSug||0,Math.max(0,flujo));
  const bonoM=p?.regimen?.includes("A")&&!p?.regimen?.includes("B")?Math.min(apvO*.15,UTM*6/12):0;
  let saldo=0;for(let i=0;i<240;i++)saldo=(saldo+apvO+bonoM)*(1+.04/12);

  const mesActual=p?.fecha?parseInt(p.fecha.slice(5,7))-1:-1;

  const content=document.getElementById("content");
  if(!p){
    content.innerHTML=`<div class="card" style="text-align:center;padding:48px"><div style="font-size:36px;margin-bottom:12px">📄</div><p style="font-weight:600;margin-bottom:8px">No hay liquidaciones</p><p style="font-size:13px;color:#64748b">Procesa tu primera liquidación para activar el dashboard.</p></div>`;
    return;
  }

  content.innerHTML=`
  <div class="health-card" style="background:${salud.bg}">
    <div>
      <div style="font-size:11px;color:#64748b;margin-bottom:4px">Salud financiera · ${p.label}</div>
      <div style="font-size:22px;font-weight:700;color:${salud.c}">${salud.l}</div>
      <div style="font-size:13px;color:#374151;margin-top:4px">${tasaA>=0?`Ahorrando el ${pct(tasaA)} de tu líquido`:`Gastas ${fmt(Math.abs(flujo))} más de lo que recibes`}</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:11px;color:#64748b">Flujo neto</div>
      <div style="font-size:26px;font-weight:700;color:${flujo>=0?"#166634":"#dc2626"}">${fmt(flujo)}</div>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi" style="background:#eff6ff"><div class="icon">💰</div><div class="lbl">Sueldo bruto</div><div class="val" style="color:#1d4ed8">${fmt(p.bruto)}</div><div class="sub">AFP ${fmt(p.afp)} · Salud ${fmt(p.salud)}</div></div>
    <div class="kpi" style="background:#f0fdf4"><div class="icon">💵</div><div class="lbl">Sueldo líquido</div><div class="val" style="color:#166534">${fmt(p.liquido)}</div><div class="sub">Impuesto: ${fmt(p.impuesto)}</div></div>
    <div class="kpi" style="background:#fef2f2"><div class="icon">💸</div><div class="lbl">Total gastos</div><div class="val" style="color:#dc2626">${fmt(totalG)}</div><div class="sub">${gastosVista.length} transacciones (acumulado)</div></div>
    <div class="kpi" style="background:#f5f3ff"><div class="icon">🏦</div><div class="lbl">Capacidad APV</div><div class="val" style="color:#6d28d9">${fmt(Math.max(0,flujo))}</div><div class="sub">APV sugerido: ${fmt(apvO)}/mes</div></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-weight:600">📅 Gastos por mes</div>
      <div style="font-size:11px;color:#94a3b8">Total: ${fmt(totalG)}</div>
    </div>
    <div class="month-bar">
      ${byMes.map((v,i)=>{
        const h=Math.round((v/maxMes)*88);
        const esMes=i===mesActual;
        return`<div class="month-col">
          <div style="font-size:9px;color:${v>0?"#374151":"transparent"};font-weight:600;height:14px;display:flex;align-items:flex-end;justify-content:center">${v>0?fmtK(v):""}</div>
          <div class="month-fill" style="height:${Math.max(h,v>0?3:1)}px;background:${esMes?"#3b82f6":v>0?"#93c5fd":"#e2e8f0"}"></div>
          <div class="month-name" style="color:${esMes?"#3b82f6":"#94a3b8"};font-weight:${esMes?"700":"400"}">${MESES[i]}</div>
        </div>`;
      }).join("")}
    </div>
  </div>

  <div class="card">
    <div style="font-weight:600;margin-bottom:14px">⚖️ Ingreso vs Gasto</div>
    ${[{l:"Líquido",v:p.liquido,c:"#22c55e"},{l:"Gastos",v:totalG,c:"#ef4444"},{l:"Disponible",v:Math.max(0,flujo),c:"#3b82f6"}].map(item=>{
      const max=Math.max(p.liquido,totalG);
      const w=max>0?Math.min((item.v/max)*100,100):0;
      return`<div class="bar-row"><span class="bar-label">${item.l}</span><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${item.c}"></div></div><span class="bar-val">${fmt(item.v)}</span></div>`;
    }).join("")}
    <div style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px"><span style="color:#64748b">Tasa de ahorro</span><span style="font-weight:700;color:${tasaA>=.2?"#166534":tasaA>=0?"#92400e":"#dc2626"}">${pct(tasaA)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,Math.min(tasaA*100,100))}%;background:${tasaA>=.2?"#22c55e":"#f59e0b"}"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;margin-top:3px"><span>0%</span><span style="color:#22c55e">Meta: 20%</span><span>100%</span></div>
    </div>
  </div>

  ${topCat.length>0?`<div class="card">
    <div style="font-weight:600;margin-bottom:14px">📂 Gastos por categoría</div>
    ${topCat.map(([cat,val])=>{const w=totalG>0?(val/totalG)*100:0;const c=CAT_CLR[cat]||"#6366f1";return`<div class="bar-row"><span class="bar-label">${cat}</span><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${c}"></div></div><span class="bar-val">${fmt(val)}</span><span class="bar-pct">${pct(val/(totalG||1))}</span></div>`;}).join("")}
  </div>`:""}

  <div class="card" style="background:${flujo>0?"#7c3aed":"#374151"};border:none;color:#fff">
    <div style="font-weight:700;font-size:15px;margin-bottom:14px">🏦 Propuesta APV personalizada</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">
      ${[["Régimen",(p.regimen||"—").split(" ")[0]],["APV mensual óptimo",fmt(apvO)],["Beneficio anual",fmt(p.benAPV)]].map(([l,v])=>`<div style="background:rgba(255,255,255,.15);border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;opacity:.8;margin-bottom:4px">${l}</div><div style="font-weight:700;font-size:16px">${v}</div></div>`).join("")}
    </div>
    <div style="background:rgba(255,255,255,.12);border-radius:10px;padding:14px">
      <div style="font-weight:600;font-size:13px;margin-bottom:4px">📈 Proyección a 20 años (4% real anual)</div>
      <div style="font-size:26px;font-weight:700">${fmt(Math.round(saldo))}</div>
      <div style="font-size:11px;opacity:.7;margin-top:4px">Ahorrando ${fmt(apvO)}/mes</div>
    </div>
  </div>

  ${gastosVista.length>0?`<div class="card" style="padding:0;overflow:hidden">
    <div style="padding:12px 16px;background:#f8fafc;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between">
      <span style="font-weight:600;font-size:13px">🧾 Todas las transacciones</span>
      <span style="font-size:11px;color:#94a3b8">${gastosVista.length} registros</span>
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Fecha</th><th>Comercio</th><th>Categoría</th><th style="text-align:right">Monto</th></tr></thead>
      <tbody>${gastosVista.sort((a,b)=>(gp(b,"date:Fecha:start")||"").localeCompare(gp(a,"date:Fecha:start")||"")).slice(0,30).map(g=>{const cat=gp(g,"Etiqueta")||"";const c=CAT_CLR[cat]||"#6366f1";return`<tr><td style="color:#94a3b8;white-space:nowrap">${(gp(g,"Fecha")||"").slice(5).replace("-","/")}</td><td style="font-weight:500">${gp(g,"Origen")||""}</td><td><span class="badge" style="background:${c}20;color:${c}">${cat}</span></td><td style="text-align:right;font-weight:600;white-space:nowrap">${fmt(gp(g,"Monto"))}</td></tr>`;}).join("")}</tbody>
    </table></div>
  </div>`:""}

  <p style="text-align:center;font-size:11px;color:#94a3b8;padding-bottom:8px">Clartu · ${new Date().toLocaleDateString("es-CL")}</p>`;
}
</script>
</body>
</html>
