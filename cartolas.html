<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Clartu — Procesador de Cartolas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh}
  .header{background:#fff;border-bottom:1px solid #e2e8f0;padding:16px 24px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .header h1{font-size:18px;font-weight:700}
  .header p{font-size:12px;color:#94a3b8}
  .wrap{max-width:860px;margin:0 auto;padding:32px 16px;display:flex;flex-direction:column;gap:24px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .upload-zone{border:2px dashed #cbd5e1;border-radius:16px;padding:48px;text-align:center;cursor:pointer;transition:all .2s}
  .upload-zone:hover{border-color:#3b82f6;background:#eff6ff}
  .upload-zone .icon{font-size:48px;margin-bottom:12px}
  .upload-zone h2{font-size:18px;font-weight:600;margin-bottom:6px}
  .upload-zone p{font-size:13px;color:#64748b}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
  .btn-blue{background:#3b82f6;color:#fff}.btn-blue:hover{background:#2563eb}
  .btn-black{background:#111827;color:#fff}.btn-black:hover{background:#374151}
  .btn-outline{background:#fff;color:#374151;border:1px solid #e2e8f0}.btn-outline:hover{background:#f8fafc}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .spin{width:44px;height:44px;border:4px solid #3b82f6;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead tr{background:#f8fafc}
  th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.04em}
  td{padding:10px 14px;border-top:1px solid #f1f5f9}
  tr:hover td{background:#fafafa}
  tfoot td{background:#f8fafc;font-weight:700;border-top:2px solid #e2e8f0}
  select{font-size:11px;border:1px solid #e2e8f0;border-radius:6px;padding:4px 8px;background:#fff;cursor:pointer}
  input[type=password],input[type=text]{width:100%;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-size:14px;outline:none;transition:border-color .15s}
  input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
  .alert{background:#fef9c3;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;font-size:13px;color:#92400e}
  .key-setup{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
  .key-setup label{font-size:12px;font-weight:600;color:#1e40af}
  .key-setup a{color:#3b82f6}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef} = React;

const CATS = ["Alimentos","Transporte","Salud","Entretenimiento","Servicios","Vestuario","Tecnología","Restaurantes","Cuotas","Hogar","Salida","Otro"];
const CAT_COLORS = {
  Alimentos:"#dcfce7:#166534",Transporte:"#dbeafe:#1e40af",Salud:"#fee2e2:#991b1b",
  Entretenimiento:"#f3e8ff:#6b21a8",Servicios:"#fef9c3:#92400e",Vestuario:"#fce7f3:#9d174d",
  Tecnología:"#cffafe:#155e75",Restaurantes:"#ffedd5:#9a3412",Cuotas:"#f1f5f9:#475569",
  Hogar:"#fef3c7:#92400e",Salida:"#e0e7ff:#3730a3",Otro:"#f1f5f9:#475569"
};
function Badge({cat,onClick}){
  const [bg,fg]=((CAT_COLORS[cat]||"#f1f5f9:#475569").split(":"));
  return<span className="badge" onClick={onClick} style={{background:bg,color:fg}}>{cat}</span>
}
const fmt=n=>"$"+Math.round(n||0).toLocaleString("es-CL");

function App(){
  const [step,setStep]=useState("upload");
  const [txs,setTxs]=useState([]);
  const [sel,setSel]=useState({});
  const [editCat,setEditCat]=useState(null);
  const [notionKey,setNotionKey]=useState(()=>localStorage.getItem("clartu_notion_key")||"");
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem("clartu_api_key")||"");
  const [showKeys,setShowKeys]=useState(false);
  const [progress,setProgress]=useState("");
  const [err,setErr]=useState("");
  const [synced,setSynced]=useState(false);
  const fileRef=useRef();

  const NOTION_DB="2b1ddb96335d81daabadf8e1a9d1b349";

  async function handleFile(e){
    const file=e.target.files?.[0]; if(!file)return;
    if(!apiKey){setErr("Necesitas ingresar tu API Key de Anthropic primero.");setShowKeys(true);return;}
    setErr("");setStep("processing");setProgress("Leyendo PDF...");
    const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
    setProgress("Analizando con IA...");
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:8000,messages:[{role:"user",content:[
          {type:"document",source:{type:"base64",media_type:"application/pdf",data:base64}},
          {type:"text",text:`Eres un asistente financiero experto en cartolas chilenas. Extrae TODAS las transacciones de gasto. Para cada una indica: fecha (YYYY-MM-DD), comercio (nombre limpio), monto (cuota mensual en CLP entero, positivo), categoria (una de: Alimentos,Transporte,Salud,Entretenimiento,Servicios,Vestuario,Tecnología,Restaurantes,Cuotas,Hogar,Salida,Otro), esGasto (false si es pago/abono/nota crédito), notas (breve). Responde SOLO con JSON: {"transactions":[{...}]}`}
        ]}]})
      });
      const data=await resp.json();
      const raw=data.content?.find(b=>b.type==="text")?.text||"";
      // Intentar reparar JSON truncado
      let jsonStr=raw.replace(/```json|```/g,"").trim());
      const txsFiltered=parsed.transactions.filter(t=>t.esGasto!==false).map((t,i)=>({...t,id:i}));
      setTxs(txsFiltered);
      const s={};txsFiltered.forEach(t=>{s[t.id]=true;});setSel(s);
      setStep("review");
    }catch(e){setErr("Error: "+e.message);setStep("upload");}
  }

  function saveKeys(){
    localStorage.setItem("clartu_api_key",apiKey);
    localStorage.setItem("clartu_notion_key",notionKey);
    setShowKeys(false);setErr("");
  }

  const selTxs=txs.filter(t=>sel[t.id]);
  const total=selTxs.reduce((s,t)=>s+t.monto,0);
  const bycat={};selTxs.forEach(t=>{bycat[t.categoria]=(bycat[t.categoria]||0)+t.monto;});
  const topCat=Object.entries(bycat).sort((a,b)=>b[1]-a[1]);

  async function syncNotion(){
    if(!notionKey){setErr("Necesitas el token de Notion.");setShowKeys(true);return;}
    setSynced(false);let ok=0,fail=0;
    for(const tx of selTxs){
      try{
        const catMap={Alimentos:"Alimentos",Transporte:"Transporte",Salud:"Salud",Entretenimiento:"Entretenimiento",Servicios:"Servicios",Vestuario:"Salida",Tecnología:"Servicios",Restaurantes:"Salida",Cuotas:"Servicios",Hogar:"Alquiler/hipoteca",Salida:"Salida",Otro:"Servicios"};
        const r=await fetch("https://api.notion.com/v1/pages",{
          method:"POST",
          headers:{"Authorization":`Bearer ${notionKey}`,"Content-Type":"application/json","Notion-Version":"2022-06-28"},
          body:JSON.stringify({parent:{database_id:NOTION_DB},properties:{Origen:{title:[{text:{content:tx.comercio}}]},Monto:{number:tx.monto},Etiqueta:{select:{name:catMap[tx.categoria]||"Servicios"}},Fecha:{date:{start:tx.fecha}}}})
        });
        if(r.ok)ok++;else fail++;
      }catch{fail++;}
    }
    setSynced(true);
    alert(`✅ ${ok} gastos enviados a Notion${fail>0?`. ${fail} fallaron`:""}.`);
  }

  function exportCSV(){
    const csv=["Fecha,Comercio,Categoría,Monto,Notas",...selTxs.map(t=>`${t.fecha},"${t.comercio}","${t.categoria}",${t.monto},"${t.notas||""}"`)].join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="gastos.csv";a.click();
  }

  return(
    <div>
      <div className="header">
        <span style={{fontSize:24}}>📄</span>
        <div><h1>Clartu — Procesador de Cartolas</h1><p>Extrae y categoriza gastos desde tu PDF bancario</p></div>
        <button className="btn btn-outline" style={{marginLeft:"auto",fontSize:12}} onClick={()=>setShowKeys(!showKeys)}>⚙️ Configurar claves</button>
      </div>

      <div className="wrap">
        {showKeys&&(
          <div className="key-setup">
            <label>🔑 API Key de Anthropic <a href="https://console.anthropic.com/keys" target="_blank">(obtener →)</a></label>
            <input type="password" placeholder="sk-ant-..." value={apiKey} onChange={e=>setApiKey(e.target.value)}/>
            <label>📥 Token de integración Notion <a href="https://www.notion.so/my-integrations" target="_blank">(obtener →)</a></label>
            <input type="password" placeholder="secret_..." value={notionKey} onChange={e=>setNotionKey(e.target.value)}/>
            <button className="btn btn-blue" style={{width:"fit-content"}} onClick={saveKeys}>Guardar claves</button>
            <p style={{fontSize:11,color:"#64748b"}}>🔒 Tus claves se guardan solo en tu navegador (localStorage). No se envían a ningún servidor externo.</p>
          </div>
        )}

        {step==="upload"&&(
          <div className="upload-zone" onClick={()=>fileRef.current?.click()}>
            <div className="icon">🧾</div>
            <h2>Sube tu estado de cuenta</h2>
            <p style={{marginBottom:16}}>PDF de Santander, BCI, Banco Chile, Scotiabank y más</p>
            <button className="btn btn-blue" onClick={e=>{e.stopPropagation();fileRef.current?.click();}}>Seleccionar PDF</button>
            <input ref={fileRef} type="file" accept=".pdf" style={{display:"none"}} onChange={handleFile}/>
            {err&&<p style={{color:"#dc2626",marginTop:12,fontSize:13}}>{err}</p>}
          </div>
        )}

        {step==="processing"&&(
          <div className="card" style={{textAlign:"center",padding:64}}>
            <div className="spin" style={{marginBottom:16}}/>
            <p style={{color:"#64748b",fontWeight:500}}>{progress}</p>
          </div>
        )}

        {step==="review"&&(
          <>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
              {topCat.slice(0,4).map(([cat,sum])=>(
                <div key={cat} className="card" style={{padding:16}}>
                  <Badge cat={cat}/><div style={{fontSize:20,fontWeight:700,marginTop:8}}>{fmt(sum)}</div>
                  <div style={{fontSize:11,color:"#94a3b8"}}>{((sum/total)*100).toFixed(1)}%</div>
                </div>
              ))}
            </div>

            <div className="card" style={{padding:0,overflow:"hidden"}}>
              <div style={{padding:"12px 16px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0",display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{fontSize:13,fontWeight:600}}>Revisión de transacciones</span>
                <button className="btn btn-outline" style={{padding:"4px 10px",fontSize:12}} onClick={()=>{const s={};txs.forEach(t=>{s[t.id]=true;});setSel(s);}}>Sel. todo</button>
                <button className="btn btn-outline" style={{padding:"4px 10px",fontSize:12}} onClick={()=>setSel({})}>Desel.</button>
                <span style={{fontSize:12,color:"#94a3b8"}}>{selTxs.length}/{txs.length} seleccionadas</span>
                <span style={{marginLeft:"auto",fontWeight:700,fontSize:14}}>{fmt(total)}</span>
              </div>
              <div style={{overflowX:"auto"}}>
                <table>
                  <thead><tr><th></th><th>Fecha</th><th>Comercio</th><th>Categoría</th><th style={{textAlign:"right"}}>Monto</th></tr></thead>
                  <tbody>
                    {txs.map(tx=>(
                      <tr key={tx.id} style={{opacity:sel[tx.id]?1:.4}}>
                        <td><input type="checkbox" checked={!!sel[tx.id]} onChange={()=>setSel(p=>({...p,[tx.id]:!p[tx.id]}))}/></td>
                        <td style={{color:"#94a3b8",whiteSpace:"nowrap"}}>{tx.fecha?.slice(5)?.replace("-","/")}</td>
                        <td><div style={{fontWeight:500}}>{tx.comercio}</div>{tx.notas&&<div style={{fontSize:11,color:"#94a3b8"}}>{tx.notas}</div>}</td>
                        <td>
                          {editCat===tx.id
                            ?<select autoFocus defaultValue={tx.categoria} onChange={e=>{setTxs(p=>p.map(t=>t.id===tx.id?{...t,categoria:e.target.value}:t));setEditCat(null);}} onBlur={()=>setEditCat(null)}>
                                {CATS.map(c=><option key={c}>{c}</option>)}
                              </select>
                            :<Badge cat={tx.categoria} onClick={()=>setEditCat(tx.id)}/>
                          }
                        </td>
                        <td style={{textAlign:"right",fontWeight:600,whiteSpace:"nowrap"}}>{fmt(tx.monto)}</td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot><tr><td colSpan={4} style={{padding:"12px 14px"}}>Total ({selTxs.length} gastos)</td><td style={{textAlign:"right",padding:"12px 14px"}}>{fmt(total)}</td></tr></tfoot>
                </table>
              </div>
            </div>

            <div className="card">
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
                <span style={{fontSize:20}}>📥</span>
                <div><div style={{fontWeight:600}}>Enviar a Notion</div><div style={{fontSize:12,color:"#94a3b8"}}>Se agregarán a tu base de datos Gastos</div></div>
              </div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                <button className="btn btn-black" style={{flex:1}} onClick={syncNotion} disabled={selTxs.length===0}>
                  Enviar {selTxs.length} gastos → Notion
                </button>
                <button className="btn btn-outline" onClick={exportCSV}>⬇ CSV</button>
              </div>
            </div>
            <button style={{textAlign:"center",background:"none",border:"none",color:"#94a3b8",cursor:"pointer",fontSize:13}} onClick={()=>{setStep("upload");setTxs([]);setSel({});if(fileRef.current)fileRef.current.value="";}}>← Procesar otra cartola</button>
          </>
        )}
      </div>
    </div>
  );
}
ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
</body>
</html>
