<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Clartu — Procesador de Liquidaciones</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e2e8f0;padding:16px 24px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.header h1{font-size:18px;font-weight:700}.header p{font-size:12px;color:#94a3b8}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
.btn-blue{background:#3b82f6;color:#fff}.btn-blue:hover{background:#2563eb}
.btn-black{background:#111827;color:#fff}.btn-black:hover{background:#374151}
.btn-outline{background:#fff;color:#374151;border:1px solid #e2e8f0}.btn-outline:hover{background:#f8fafc}
.btn-full{width:100%}.btn-sm{padding:5px 12px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}
.wrap{max-width:720px;margin:0 auto;padding:32px 16px;display:flex;flex-direction:column;gap:20px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px}
.upload-zone{border:2px dashed #cbd5e1;border-radius:16px;padding:56px;text-align:center;cursor:pointer;transition:all .2s}
.upload-zone:hover{border-color:#3b82f6;background:#eff6ff}
.key-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px}
.key-box label{font-size:12px;font-weight:600;color:#1e40af;display:block;margin-bottom:4px}
.key-box a{color:#3b82f6;font-weight:400}
input[type=password]{width:100%;border:1px solid #e2e8f0;border-radius:10px;padding:9px 14px;font-size:13px;outline:none}
input:focus{border-color:#3b82f6}
input[type=range]{width:100%;accent-color:#7c3aed}
.spin{width:44px;height:44px;border:4px solid #3b82f6;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{border-radius:14px;padding:16px}
.kpi .lbl{font-size:11px;color:#94a3b8;margin-bottom:4px;text-transform:uppercase}
.kpi .val{font-size:20px;font-weight:700}.kpi .sub{font-size:10px;color:#94a3b8;margin-top:2px}
.err{color:#dc2626;font-size:12px;margin-top:8px}
#notice{display:none;position:fixed;bottom:20px;right:20px;background:#111827;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:500;z-index:100}
</style>
</head>
<body>
<div class="header">
  <span style="font-size:24px">🧾</span>
  <div><h1>Clartu — Procesador de Liquidaciones</h1><p>Extrae ingresos y calcula tu APV óptimo</p></div>
  <button class="btn btn-outline btn-sm" style="margin-left:auto" onclick="toggleKeys()">⚙️ Claves</button>
</div>
<div class="wrap">
  <div class="key-box" id="keyBox" style="display:none">
    <div>
      <label>🔑 API Key Anthropic <a href="https://console.anthropic.com/settings/keys" target="_blank">(obtener →)</a></label>
      <input type="password" id="apiKey" placeholder="sk-ant-..."/>
    </div>
    <div>
      <label>📥 Token Notion <a href="https://www.notion.so/profile/integrations/internal" target="_blank">(obtener →)</a></label>
      <input type="password" id="notionKey" placeholder="secret_ o ntn_..."/>
    </div>
    <button class="btn btn-blue" style="width:fit-content" onclick="saveKeys()">Guardar</button>
    <p style="font-size:11px;color:#64748b">🔒 Tus claves se guardan solo en tu navegador.</p>
  </div>
  <div id="uploadSection">
    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
      <div style="font-size:48px;margin-bottom:12px">🧾</div>
      <h2 style="margin-bottom:8px;font-size:18px">Sube tu liquidación de sueldo</h2>
      <p style="color:#64748b;margin-bottom:20px;font-size:13px">PDF de cualquier empresa chilena</p>
      <button class="btn btn-blue" onclick="event.stopPropagation();document.getElementById('fileInput').click()">Seleccionar PDF</button>
      <input type="file" id="fileInput" accept=".pdf" style="display:none" onclick="this.value=''" onchange="handleFile(this)"/>
      <p class="err" id="uploadErr"></p>
    </div>
  </div>
  <div id="processingSection" style="display:none" class="card">
    <div style="text-align:center;padding:48px">
      <div class="spin" style="margin-bottom:16px"></div>
      <p style="color:#64748b;font-weight:500" id="progressText">Leyendo PDF...</p>
    </div>
  </div>
  <div id="resultSection" style="display:none">
    <div class="card" id="liquidCard"></div>
    <div class="card" style="margin-top:16px" id="apvCard"></div>
    <div class="card" style="margin-top:16px" id="syncCard"></div>
    <button class="btn btn-outline btn-full" style="margin-top:8px" onclick="reset()">← Procesar otra liquidación</button>
  </div>
</div>
<div id="notice"></div>
<script>
const NOTION_DB="9658270ba4b643c5ae3105a938d7a0cb";
const UTM=68306,UF=38500;

function calcISC(b){const t=TRAMOS.find(t=>(b/UTM)<=t.h)||TRAMOS[TRAMOS.length-1];return{imp:Math.max(0,Math.round(b*t.t-t.r)),tasa:t.t};}
function apvCalc(b,apvM){const{tasa}=calcISC(b);const bonoA=Math.min(apvM*12*.15,6*UTM);const ahorroB=Math.min(apvM*12,600*UF)*tasa;const rec=tasa>=.135?"B - Deducción renta":tasa<=.04?"A - Bono 15%":"A/B - Zona quiebre";return{bonoA:Math.round(bonoA),ahorroB:Math.round(ahorroB),tasa,rec};}
const fmt=n=>"$"+Math.round(n||0).toLocaleString("es-CL");
const pct=n=>((n||0)*100).toFixed(1)+"%";
const getKey=k=>localStorage.getItem(k)||"";
let currentData=null,currentApvPct=10;

function toggleKeys(){const b=document.getElementById("keyBox");b.style.display=b.sty
