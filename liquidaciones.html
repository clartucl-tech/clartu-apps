<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Clartu — Procesador de Liquidaciones</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh}
  .header{background:#fff;border-bottom:1px solid #e2e8f0;padding:16px 24px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .header h1{font-size:18px;font-weight:700}
  .header p{font-size:12px;color:#94a3b8}
  .wrap{max-width:720px;margin:0 auto;padding:32px 16px;display:flex;flex-direction:column;gap:20px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px}
  .upload-zone{border:2px dashed #cbd5e1;border-radius:16px;padding:56px;text-align:center;cursor:pointer;transition:all .2s}
  .upload-zone:hover{border-color:#3b82f6;background:#eff6ff}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
  .btn-blue{background:#3b82f6;color:#fff}.btn-blue:hover{background:#2563eb}
  .btn-black{background:#111827;color:#fff}.btn-black:hover{background:#374151}
  .btn-outline{background:#fff;color:#374151;border:1px solid #e2e8f0}.btn-outline:hover{background:#f8fafc}
  .btn-full{width:100%}
  .spin{width:44px;height:44px;border:4px solid #3b82f6;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .kpi{border-radius:14px;padding:16px}
  .kpi .label{font-size:11px;color:#94a3b8;margin-bottom:4px}
  .kpi .value{font-size:20px;font-weight:700}
  .kpi .sub{font-size:11px;color:#94a3b8;margin-top:2px}
  input[type=password]{width:100%;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-size:14px;outline:none}
  input:focus{border-color:#3b82f6}
  .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
  .row:last-child{border:none}
  .apv-card{border-radius:14px;padding:20px;color:#fff}
  .rec{border-radius:14px;padding:16px;color:#fff;font-size:13px}
  .key-setup{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
  .key-setup label{font-size:12px;font-weight:600;color:#1e40af}
  .key-setup a{color:#3b82f6}
  input[type=range]{width:100%;accent-color:#7c3aed}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useMemo}=React;
const UTM=68306,UF=38500;
const TRAMOS=[
  {hasta:13.5,tasa:0,rebaja:0},
  {hasta:30,tasa:.04,rebaja:.54*UTM},
  {hasta:50,tasa:.08,rebaja:1.74*UTM},
  {hasta:70,tasa:.135,rebaja:4.49*UTM},
  {hasta:90,tasa:.23,rebaja:11.14*UTM},
  {hasta:120,tasa:.304,rebaja:17.8*UTM},
  {hasta:150,tasa:.35,rebaja:23.32*UTM},
  {hasta:Infinity,tasa:.40,rebaja:30.82*UTM},
];
function calcISC(b){const t=TRAMOS.find(t=>(b/UTM)<=t.hasta)||TRAMOS[TRAMOS.length-1];return{imp:Math.max(0,Math.round(b*t.tasa-t.rebaja)),tasa:t.tasa};}
function apvCalc(b,apvM){
  const{tasa}=calcISC(b);
  const bonoA=Math.min(apvM*12*.15,6*UTM);
  const ahorroB=Math.min(apvM*12,600*UF)*tasa;
  const rec=tasa>=.135?"B - Deducción renta":tasa<=.04?"A - Bono 15%":"A/B - Zona quiebre";
  return{bonoA:Math.round(bonoA),ahorroB:Math.round(ahorroB),tasa,rec};
}
const fmt=n=>"$"+Math.round(n||0).toLocaleString("es-CL");
const pct=n=>((n||0)*100).toFixed(1)+"%";

function App(){
  const [step,setStep]=useState("upload");
  const [data,setData]=useState(null);
  const [apvPct,setApvPct]=useState(10);
  const [notionKey,setNotionKey]=useState(()=>localStorage.getItem("clartu_notion_key")||"");
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem("clartu_api_key")||"");
  const [showKeys,setShowKeys]=useState(false);
  const [progress,setProgress]=useState("");
  const [err,setErr]=useState("");
  const [synced,setSynced]=useState(false);
  const fileRef=useRef();
  const NOTION_DB="92bda68b-d35b-4774-aaf8-15ec7606b546";

  async function handleFile(e){
    const file=e.target.files?.[0];if(!file)return;
    if(!apiKey){setErr("Configura tu API Key primero.");setShowKeys(true);return;}
    setErr("");setStep("processing");setProgress("Leyendo PDF...");
    const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
    setProgress("Extrayendo datos con IA...");
    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,messages:[{role:"user",content:[
          {type:"document",source:{type:"base64",media_type:"application/pdf",data:base64}},
          {type:"text",text:`Extrae estos datos de la liquidación de sueldo chilena. Responde SOLO con JSON válido (sin markdown): {"periodo":"Mes Año","empleador":"nombre","fecha_pago":"YYYY-MM-DD","sueldo_base":número,"sueldo_bruto":número,"total_imponible":número,"afp_nombre":"nombre","afp_monto":número,"salud_nombre":"nombre","salud_monto":número,"impuesto_2da_cat":número,"total_descuentos":número,"sueldo_liquido":número,"notas":"observación si hay algo relevante"}`}
        ]}]})
      });
      const json=await resp.json();
      const raw=json.content?.find(b=>b.type==="text")?.text||"";
      setData(JSON.parse(raw.replace(/```json|```/g,"").trim()));
      setStep("result");
    }catch(e){setErr("Error: "+e.message);setStep("upload");}
  }

  function saveKeys(){localStorage.setItem("clartu_api_key",apiKey);localStorage.setItem("clartu_notion_key",notionKey);setShowKeys(false);setErr("");}

  const apvM=data?Math.round(data.sueldo_bruto*apvPct/100):0;
  const apv=data?apvCalc(data.sueldo_bruto,apvM):null;
  const isc=data?calcISC(data.sueldo_bruto):null;

  async function syncNotion(){
    if(!notionKey){setErr("Configura tu token de Notion.");setShowKeys(true);return;}
    const body={parent:{database_id:NOTION_DB},properties:{
      "Período":{title:[{text:{content:data.periodo||""}}]},
      "Empleador":{rich_text:[{text:{content:data.empleador||""}}]},
      "Sueldo Bruto":{number:data.sueldo_bruto},
      "Sueldo Líquido":{number:data.sueldo_liquido},
      "AFP":{number:data.afp_monto},
      "Isapre/Fonasa":{number:data.salud_monto},
      "Impuesto 2da Cat.":{number:data.impuesto_2da_cat||0},
      "Tasa Marginal":{rich_text:[{text:{content:pct(apv.tasa)}}]},
      "Régimen APV Recomendado":{select:{name:apv.rec}},
      "APV Sugerido Mensual":{number:apvM},
      "Beneficio APV Anual":{number:apv.rec.startsWith("B")?apv.ahorroB:apv.bonoA},
      "Notas":{rich_text:[{text:{content:data.notas||""}}]},
      ...(data.fecha_pago?{"Fecha Liquidación":{date:{start:data.fecha_pago}}}:{}),
    }};
    const r=await fetch("https://api.notion.com/v1/pages",{method:"POST",headers:{"Authorization":`Bearer ${notionKey}`,"Content-Type":"application/json","Notion-Version":"2022-06-28"},body:JSON.stringify(body)});
    if(r.ok){setSynced(true);alert("✅ Liquidación guardada en Notion correctamente.");}
    else alert("❌ Error al guardar en Notion. Verifica tu token.");
  }

  return(
    <div>
      <div className="header">
        <span style={{fontSize:24}}>🧾</span>
        <div><h1>Clartu — Procesador de Liquidaciones</h1><p>Extrae ingresos y calcula tu APV óptimo</p></div>
        <button className="btn btn-outline" style={{marginLeft:"auto",fontSize:12}} onClick={()=>setShowKeys(!showKeys)}>⚙️ Claves</button>
      </div>
      <div className="wrap">
        {showKeys&&(
          <div className="key-setup">
            <label>🔑 API Key Anthropic <a href="https://console.anthropic.com/keys" target="_blank">(obtener →)</a></label>
            <input type="password" placeholder="sk-ant-..." value={apiKey} onChange={e=>setApiKey(e.target.value)}/>
            <label>📥 Token Notion <a href="https://www.notion.so/my-integrations" target="_blank">(obtener →)</a></label>
            <input type="password" placeholder="secret_..." value={notionKey} onChange={e=>setNotionKey(e.target.value)}/>
            <button className="btn btn-blue" style={{width:"fit-content"}} onClick={saveKeys}>Guardar</button>
          </div>
        )}

        {step==="upload"&&(
          <div className="upload-zone" onClick={()=>fileRef.current?.click()}>
            <div style={{fontSize:48,marginBottom:12}}>🧾</div>
            <h2 style={{marginBottom:8}}>Sube tu liquidación de sueldo</h2>
            <p style={{color:"#64748b",marginBottom:20}}>PDF de cualquier empresa chilena</p>
            <button className="btn btn-blue" onClick={e=>{e.stopPropagation();fileRef.current?.click();}}>Seleccionar PDF</button>
            <input ref={fileRef} type="file" accept=".pdf" style={{display:"none"}} onChange={handleFile}/>
            {err&&<p style={{color:"#dc2626",marginTop:12,fontSize:13}}>{err}</p>}
          </div>
        )}

        {step==="processing"&&(
          <div className="card" style={{textAlign:"center",padding:64}}>
            <div className="spin" style={{marginBottom:16}}/>
            <p style={{color:"#64748b"}}>{progress}</p>
          </div>
        )}

        {step==="result"&&data&&apv&&(
          <>
            <div className="card">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
                <div><div style={{fontWeight:700,fontSize:18}}>{data.periodo}</div><div style={{fontSize:13,color:"#64748b"}}>{data.empleador}</div></div>
                <span style={{background:"#dcfce7",color:"#166534",padding:"2px 12px",borderRadius:999,fontSize:12,fontWeight:600}}>✓ Procesada</span>
              </div>
              <div className="kpi-grid">
                <div className="kpi" style={{background:"#eff6ff"}}><div className="label">Sueldo bruto</div><div className="value" style={{color:"#1d4ed8"}}>{fmt(data.sueldo_bruto)}</div></div>
                <div className="kpi" style={{background:"#f0fdf4"}}><div className="label">Sueldo líquido</div><div className="value" style={{color:"#166534"}}>{fmt(data.sueldo_liquido)}</div></div>
                <div className="kpi" style={{background:"#fef2f2"}}><div className="label">Impuesto 2da Cat.</div><div className="value" style={{color:"#dc2626"}}>{fmt(data.impuesto_2da_cat)}</div></div>
              </div>
              <div style={{marginTop:16,display:"flex",gap:8,flexWrap:"wrap"}}>
                <span style={{fontSize:12,color:"#64748b"}}>AFP {data.afp_nombre}: <b>{fmt(data.afp_monto)}</b></span>
                <span style={{fontSize:12,color:"#64748b"}}>•</span>
                <span style={{fontSize:12,color:"#64748b"}}>{data.salud_nombre}: <b>{fmt(data.salud_monto)}</b></span>
                <span style={{fontSize:12,color:"#64748b"}}>•</span>
                <span style={{fontSize:12,color:"#64748b"}}>Tasa marginal: <b>{pct(apv.tasa)}</b></span>
              </div>
              {data.notas&&<div style={{marginTop:12,background:"#fef9c3",border:"1px solid #fde68a",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#92400e"}}>💡 {data.notas}</div>}
            </div>

            <div className="card">
              <div style={{fontWeight:600,marginBottom:4}}>🏦 Propuesta APV personalizada</div>
              <p style={{fontSize:12,color:"#94a3b8",marginBottom:16}}>Ajusta el % de tu sueldo para el APV</p>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:13}}>
                <span>Aporte mensual</span>
                <span style={{fontWeight:700,color:"#7c3aed"}}>{fmt(apvM)} ({apvPct}%)</span>
              </div>
              <input type="range" min={1} max={25} value={apvPct} onChange={e=>setApvPct(+e.target.value)} style={{marginBottom:16}}/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
                <div style={{border:`2px solid ${apv.rec.startsWith("A")&&!apv.rec.includes("/")?"#3b82f6":"#e2e8f0"}`,borderRadius:14,padding:16,background:apv.rec.startsWith("A")&&!apv.rec.includes("/")?"#eff6ff":"#fff"}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                    <div style={{fontWeight:700,fontSize:13}}>Régimen A</div>
                    {apv.rec.startsWith("A")&&!apv.rec.includes("/")&&<span style={{background:"#3b82f6",color:"#fff",fontSize:10,padding:"2px 8px",borderRadius:999,fontWeight:700}}>✓ Mejor</span>}
                  </div>
                  <div style={{fontSize:11,color:"#94a3b8",marginBottom:8}}>Bono estatal 15%</div>
                  <div style={{fontSize:22,fontWeight:700,color:"#1d4ed8"}}>{fmt(apv.bonoA)}</div>
                  <div style={{fontSize:11,color:"#3b82f6"}}>beneficio anual</div>
                </div>
                <div style={{border:`2px solid ${apv.rec.startsWith("B")?"#7c3aed":"#e2e8f0"}`,borderRadius:14,padding:16,background:apv.rec.startsWith("B")?"#f5f3ff":"#fff"}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                    <div style={{fontWeight:700,fontSize:13}}>Régimen B</div>
                    {apv.rec.startsWith("B")&&<span style={{background:"#7c3aed",color:"#fff",fontSize:10,padding:"2px 8px",borderRadius:999,fontWeight:700}}>✓ Mejor</span>}
                  </div>
                  <div style={{fontSize:11,color:"#94a3b8",marginBottom:8}}>Deducción base imponible</div>
                  <div style={{fontSize:22,fontWeight:700,color:"#6d28d9"}}>{fmt(apv.ahorroB)}</div>
                  <div style={{fontSize:11,color:"#7c3aed"}}>ahorro tributario anual</div>
                </div>
              </div>
              <div className="rec" style={{background:apv.rec.startsWith("B")?"#7c3aed":apv.rec.includes("/")?"#d97706":"#2563eb"}}>
                <div style={{fontWeight:700,marginBottom:4}}>
                  {apv.rec.startsWith("B")?"Régimen B te conviene más":apv.rec.includes("/")?"Zona de quiebre — ambos similares":"Régimen A te conviene más"}
                </div>
                <div style={{opacity:.9,lineHeight:1.5}}>Ahorrando {fmt(apvM)}/mes obtienes <b>{fmt(apv.rec.startsWith("B")?apv.ahorroB:apv.bonoA)}</b> anuales de beneficio.</div>
                <div style={{fontSize:10,opacity:.6,marginTop:4}}>⚠️ Cálculo educativo · Consulta tu AFP para asesoría personalizada</div>
              </div>
            </div>

            <div className="card">
              <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:16}}>
                <span style={{fontSize:20}}>📥</span>
                <div><div style={{fontWeight:600}}>Guardar en Notion</div><div style={{fontSize:12,color:"#94a3b8"}}>Base de datos Liquidaciones</div></div>
              </div>
              {synced
                ?<div style={{textAlign:"center",padding:16}}><div style={{fontSize:36}}>✅</div><p style={{fontWeight:600,marginTop:8}}>Guardado correctamente</p></div>
                :<button className="btn btn-black btn-full" onClick={syncNotion}>Guardar en Notion → 📋 Liquidaciones</button>
              }
            </div>
            <button style={{textAlign:"center",background:"none",border:"none",color:"#94a3b8",cursor:"pointer",fontSize:13}} onClick={()=>{setStep("upload");setData(null);setSynced(false);if(fileRef.current)fileRef.current.value="";}}>← Procesar otra liquidación</button>
          </>
        )}
      </div>
    </div>
  );
}
ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
</body>
</html>
