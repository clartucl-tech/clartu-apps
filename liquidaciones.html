<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Clartu — Procesador de Liquidaciones</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e2e8f0;padding:16px 24px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.header h1{font-size:18px;font-weight:700}.header p{font-size:12px;color:#94a3b8}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .15s}
.btn-blue{background:#3b82f6;color:#fff}.btn-blue:hover{background:#2563eb}
.btn-black{background:#111827;color:#fff}.btn-black:hover{background:#374151}
.btn-outline{background:#fff;color:#374151;border:1px solid #e2e8f0}.btn-outline:hover{background:#f8fafc}
.btn-full{width:100%}.btn-sm{padding:5px 12px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}
.wrap{max-width:720px;margin:0 auto;padding:32px 16px;display:flex;flex-direction:column;gap:20px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px}
.upload-zone{border:2px dashed #cbd5e1;border-radius:16px;padding:56px;text-align:center;cursor:pointer;transition:all .2s}
.upload-zone:hover{border-color:#3b82f6;background:#eff6ff}
.key-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px}
.key-box label{font-size:12px;font-weight:600;color:#1e40af;display:block;margin-bottom:4px}
.key-box a{color:#3b82f6;font-weight:400}
input[type=password]{width:100%;border:1px solid #e2e8f0;border-radius:10px;padding:9px 14px;font-size:13px;outline:none}
input:focus{border-color:#3b82f6}
input[type=range]{width:100%;accent-color:#7c3aed}
.spin{width:44px;height:44px;border:4px solid #3b82f6;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{border-radius:14px;padding:16px}
.kpi .lbl{font-size:11px;color:#94a3b8;margin-bottom:4px;text-transform:uppercase}
.kpi .val{font-size:20px;font-weight:700}.kpi .sub{font-size:10px;color:#94a3b8;margin-top:2px}
.err{color:#dc2626;font-size:12px;margin-top:8px}
#notice{display:none;position:fixed;bottom:20px;right:20px;background:#111827;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:500;z-index:100}
</style>
</head>
<body>
<div class="header">
  <span style="font-size:24px">🧾</span>
  <div><h1>Clartu — Procesador de Liquidaciones</h1><p>Extrae ingresos y calcula tu APV óptimo</p></div>
  <button class="btn btn-outline btn-sm" style="margin-left:auto" onclick="toggleKeys()">⚙️ Claves</button>
</div>
<div class="wrap">
  <div class="key-box" id="keyBox" style="display:none">
    <div>
      <label>🔑 API Key Anthropic <a href="https://console.anthropic.com/settings/keys" target="_blank">(obtener →)</a></label>
      <input type="password" id="apiKey" placeholder="sk-ant-..."/>
    </div>
    <div>
      <label>📥 Token Notion <a href="https://www.notion.so/profile/integrations/internal" target="_blank">(obtener →)</a></label>
      <input type="password" id="notionKey" placeholder="secret_ o ntn_..."/>
    </div>
    <button class="btn btn-blue" style="width:fit-content" onclick="saveKeys()">Guardar</button>
    <p style="font-size:11px;color:#64748b">🔒 Tus claves se guardan solo en tu navegador.</p>
  </div>
  <div id="uploadSection">
    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
      <div style="font-size:48px;margin-bottom:12px">🧾</div>
      <h2 style="margin-bottom:8px;font-size:18px">Sube tu liquidación de sueldo</h2>
      <p style="color:#64748b;margin-bottom:20px;font-size:13px">PDF de cualquier empresa chilena</p>
      <button class="btn btn-blue" onclick="event.stopPropagation();document.getElementById('fileInput').click()">Seleccionar PDF</button>
      <input type="file" id="fileInput" accept=".pdf" style="display:none" onclick="this.value=''" onchange="handleFile(this)"/>
      <p class="err" id="uploadErr"></p>
    </div>
  </div>
  <div id="processingSection" style="display:none" class="card">
    <div style="text-align:center;padding:48px">
      <div class="spin" style="margin-bottom:16px"></div>
      <p style="color:#64748b;font-weight:500" id="progressText">Leyendo PDF...</p>
    </div>
  </div>
  <div id="resultSection" style="display:none">
    <div class="card" id="liquidCard"></div>
    <div class="card" style="margin-top:16px" id="apvCard"></div>
    <div class="card" style="margin-top:16px" id="syncCard"></div>
    <button class="btn btn-outline btn-full" style="margin-top:8px" onclick="reset()">← Procesar otra liquidación</button>
  </div>
</div>
<div id="notice"></div>
<script>
const NOTION_DB="9658270ba4b643c5ae3105a938d7a0cb";
const UTM=68306,UF=38500;
const TRAMOS=[{h:13.5,t:0,r:0},{h:30,t:.04,r:.54*UTM},{h:50,t:.08,r:1.74*UTM},{h:70,t:.135,r:4.49*UTM},{h:90,t:.23,r:11.14*UTM},{h:120,t:.304,r:17.8*UTM},{h:150,t:.35,r:23.32*UTM},{h:1e9,t:.40,r:30.82*UTM}];
function calcISC(b){const t=TRAMOS.find(t=>(b/UTM)<=t.h)||TRAMOS[TRAMOS.length-1];return{imp:Math.max(0,Math.round(b*t.t-t.r)),tasa:t.t};}
function apvCalc(b,apvM){const{tasa}=calcISC(b);const bonoA=Math.min(apvM*12*.15,6*UTM);const ahorroB=Math.min(apvM*12,600*UF)*tasa;const rec=tasa>=.135?"B - Deducción renta":tasa<=.04?"A - Bono 15%":"A/B - Zona quiebre";return{bonoA:Math.round(bonoA),ahorroB:Math.round(ahorroB),tasa,rec};}
const fmt=n=>"$"+Math.round(n||0).toLocaleString("es-CL");
const pct=n=>((n||0)*100).toFixed(1)+"%";
const getKey=k=>localStorage.getItem(k)||"";
let currentData=null,currentApvPct=10;
function toggleKeys(){const b=document.getElementById("keyBox");b.style.display=b.style.display==="none"?"block":"none";document.getElementById("apiKey").value=getKey("clartu_api");document.getElementById("notionKey").value=getKey("clartu_notion");}
function saveKeys(){localStorage.setItem("clartu_api",document.getElementById("apiKey").value.trim());localStorage.setItem("clartu_notion",document.getElementById("notionKey").value.trim());document.getElementById("keyBox").style.display="none";showNotice("✅ Claves guardadas");}
function showNotice(msg){const el=document.getElementById("notice");el.textContent=msg;el.style.display="block";setTimeout(()=>el.style.display="none",3000);}
async function handleFile(input){
  const file=input.files[0];if(!file)return;
  const apiKey=getKey("clartu_api");
  if(!apiKey){document.getElementById("uploadErr").textContent="Configura tu API Key primero.";toggleKeys();return;}
  document.getElementById("uploadErr").textContent="";
  document.getElementById("uploadSection").style.display="none";
  document.getElementById("processingSection").style.display="block";
  const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
  document.getElementById("progressText").textContent="Extrayendo datos con IA...";
  try{
    const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,messages:[{role:"user",content:[{type:"document",source:{type:"base64",media_type:"application/pdf",data:base64}},{type:"text",text:`Extrae estos datos de la liquidación de sueldo chilena. Responde SOLO con JSON válido sin markdown:\n{"periodo":"Mes Año","empleador":"nombre empresa","fecha_pago":"YYYY-MM-DD","sueldo_base":número,"sueldo_bruto":número,"total_imponible":número,"afp_nombre":"nombre","afp_monto":número,"salud_nombre":"nombre isapre o fonasa","salud_monto":número,"impuesto_2da_cat":número,"total_descuentos":número,"sueldo_liquido":número,"notas":"observación relevante si existe"}`}]}]})});
    const json=await resp.json();
    if(json.error)throw new Error(json.error.message);
    const raw=(json.content||[]).find(b=>b.type==="text")?.text||"";
    currentData=JSON.parse(raw.replace(/```json|```/g,"").trim());
    currentApvPct=10;
    document.getElementById("processingSection").style.display="none";
    renderResult();
    document.getElementById("resultSection").style.display="block";
  }catch(e){document.getElementById("processingSection").style.display="none";document.getElementById("uploadSection").style.display="block";document.getElementById("uploadErr").textContent="Error: "+e.message;}
}
function renderResult(){
  const d=currentData;
  const apvM=Math.round(d.sueldo_bruto*currentApvPct/100);
  const apv=apvCalc(d.sueldo_bruto,apvM);
  document.getElementById("liquidCard").innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
      <div><div style="font-weight:700;font-size:18px">${d.periodo}</div><div style="font-size:13px;color:#64748b">${d.empleador}</div></div>
      <span style="background:#dcfce7;color:#166534;padding:2px 12px;border-radius:999px;font-size:12px;font-weight:600">✓ Procesada</span>
    </div>
    <div class="kpi-grid">
      <div class="kpi" style="background:#eff6ff"><div class="lbl">Sueldo bruto</div><div class="val" style="color:#1d4ed8">${fmt(d.sueldo_bruto)}</div></div>
      <div class="kpi" style="background:#f0fdf4"><div class="lbl">Sueldo líquido</div><div class="val" style="color:#166534">${fmt(d.sueldo_liquido)}</div></div>
      <div class="kpi" style="background:#fef2f2"><div class="lbl">Impuesto 2da Cat.</div><div class="val" style="color:#dc2626">${fmt(d.impuesto_2da_cat)}</div></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:16px;flex-wrap:wrap">
      <span style="font-size:12px;color:#64748b">AFP ${d.afp_nombre}: <b>${fmt(d.afp_monto)}</b></span>
      <span style="font-size:12px;color:#64748b">${d.salud_nombre}: <b>${fmt(d.salud_monto)}</b></span>
      <span style="font-size:12px;color:#64748b">Tasa marginal: <b>${pct(apv.tasa)}</b></span>
    </div>
    ${d.notas?`<div style="margin-top:12px;background:#fef9c3;border:1px solid #fde68a;border-radius:8px;padding:8px 12px;font-size:12px;color:#92400e">💡 ${d.notas}</div>`:""}`;
  document.getElementById("apvCard").innerHTML=`
    <div style="font-weight:600;margin-bottom:4px">🏦 Propuesta APV personalizada</div>
    <p style="font-size:12px;color:#94a3b8;margin-bottom:16px">Ajusta el % de tu sueldo para APV</p>
    <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px">
      <span>Aporte mensual</span><span style="font-weight:700;color:#7c3aed">${fmt(apvM)} (${currentApvPct}%)</span>
    </div>
    <input type="range" min="1" max="25" value="${currentApvPct}" oninput="updateApv(this.value)" style="margin-bottom:16px"/>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div style="border:2px solid ${apv.rec.startsWith("A")&&!apv.rec.includes("/")?"#3b82f6":"#e2e8f0"};border-radius:14px;padding:16px;background:${apv.rec.startsWith("A")&&!apv.rec.includes("/")?"#eff6ff":"#fff"}">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px"><div style="font-weight:700;font-size:13px">Régimen A</div>${apv.rec.startsWith("A")&&!apv.rec.includes("/")?'<span style="background:#3b82f6;color:#fff;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:700">✓ Mejor</span>':""}</div>
        <div style="font-size:11px;color:#94a3b8;margin-bottom:8px">Bono estatal 15%</div>
        <div style="font-size:22px;font-weight:700;color:#1d4ed8">${fmt(apv.bonoA)}</div>
        <div style="font-size:11px;color:#3b82f6">beneficio anual</div>
      </div>
      <div style="border:2px solid ${apv.rec.startsWith("B")?"#7c3aed":"#e2e8f0"};border-radius:14px;padding:16px;background:${apv.rec.startsWith("B")?"#f5f3ff":"#fff"}">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px"><div style="font-weight:700;font-size:13px">Régimen B</div>${apv.rec.startsWith("B")?'<span style="background:#7c3aed;color:#fff;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:700">✓ Mejor</span>':""}</div>
        <div style="font-size:11px;color:#94a3b8;margin-bottom:8px">Deducción base imponible</div>
        <div style="font-size:22px;font-weight:700;color:#6d28d9">${fmt(apv.ahorroB)}</div>
        <div style="font-size:11px;color:#7c3aed">ahorro tributario anual</div>
      </div>
    </div>
    <div style="border-radius:14px;padding:16px;color:#fff;background:${apv.rec.startsWith("B")?"#7c3aed":apv.rec.includes("/")?"#d97706":"#2563eb"}">
      <div style="font-weight:700;margin-bottom:4px">${apv.rec.startsWith("B")?"Régimen B te conviene más":apv.rec.includes("/")?"Zona de quiebre — ambos similares":"Régimen A te conviene más"}</div>
      <div style="opacity:.9;font-size:12px;line-height:1.5">Ahorrando ${fmt(apvM)}/mes obtienes <b>${fmt(apv.rec.startsWith("B")?apv.ahorroB:apv.bonoA)}</b> anuales de beneficio.</div>
      <div style="font-size:10px;opacity:.6;margin-top:4px">⚠️ Cálculo educativo · Consulta tu AFP para asesoría personalizada</div>
    </div>`;
  document.getElementById("syncCard").innerHTML=`
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px">
      <span style="font-size:20px">📥</span>
      <div><div style="font-weight:600">Guardar en Notion</div><div style="font-size:12px;color:#94a3b8">Base de datos 📋 Liquidaciones</div></div>
    </div>
    <button class="btn btn-black btn-full" id="syncBtn" onclick="syncNotion()">Guardar en Notion → 📋 Liquidaciones</button>
    <p class="err" id="syncErr"></p>`;
}
function updateApv(val){currentApvPct=parseInt(val);renderResult();}
async function syncNotion(){
  const notionKey=getKey("clartu_notion");
  if(!notionKey){document.getElementById("syncErr").textContent="Configura tu token de Notion.";toggleKeys();return;}
  const d=currentData;
  const apvM=Math.round(d.sueldo_bruto*currentApvPct/100);
  const apv=apvCalc(d.sueldo_bruto,apvM);
  document.getElementById("syncBtn").disabled=true;document.getElementById("syncBtn").textContent="Guardando...";
  const body={parent:{database_id:NOTION_DB},properties:{"Período":{title:[{text:{content:d.periodo||""}}]},"Empleador":{rich_text:[{text:{content:d.empleador||""}}]},"Sueldo Bruto":{number:d.sueldo_bruto},"Sueldo Líquido":{number:d.sueldo_liquido},"AFP":{number:d.afp_monto},"Isapre/Fonasa":{number:d.salud_monto},"Impuesto 2da Cat.":{number:d.impuesto_2da_cat||0},"Tasa Marginal":{rich_text:[{text:{content:pct(apv.tasa)}}]},"Régimen APV Recomendado":{select:{name:apv.rec}},"APV Sugerido Mensual":{number:apvM},"Beneficio APV Anual":{number:apv.rec.startsWith("B")?apv.ahorroB:apv.bonoA},"Notas":{rich_text:[{text:{content:d.notas||""}}]},...(d.fecha_pago?{"Fecha Liquidación":{date:{start:d.fecha_pago}}}:{})}};
  try{
    const r=await fetch("/api/notion?path=pages",{method:"POST",headers:{"Authorization":"Bearer "+notionKey,"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(r.ok){document.getElementById("syncCard").innerHTML=`<div style="text-align:center;padding:16px"><div style="font-size:36px">✅</div><p style="font-weight:600;margin-top:8px">Guardado en Notion</p><p style="font-size:13px;color:#64748b;margin-top:4px">La liquidación quedó registrada en 📋 Liquidaciones</p></div>`;showNotice("✅ Liquidación guardada en Notion");}
    else{const err=await r.text();document.getElementById("syncBtn").disabled=false;document.getElementById("syncBtn").textContent="Guardar en Notion → 📋 Liquidaciones";document.getElementById("syncErr").textContent="Error: "+err.slice(0,200);}
  }catch(e){document.getElementById("syncBtn").disabled=false;document.getElementById("syncBtn").textContent="Guardar en Notion → 📋 Liquidaciones";document.getElementById("syncErr").textContent="Error: "+e.message;}
}
function reset(){currentData=null;document.getElementById("resultSection").style.display="none";document.getElementById("uploadSection").style.display="block";document.getElementById("fileInput").value="";document.getElementById("uploadErr").textContent="";}
</script>
</body>
</html>
